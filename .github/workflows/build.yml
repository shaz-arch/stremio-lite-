name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease :linux:fatJar --no-daemon -PbuildNumber=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: stremio-lite-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish download link
        run: |
          cp app/build/outputs/apk/release/app-release.apk stremio-lite.apk
          cp linux/build/dist/stremio-lean-linux.jar stremio-lean-linux.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stremio Lite build ${{ github.run_number }}
          make_latest: true
          files: |
            stremio-lite.apk
            stremio-lean-linux.jar
