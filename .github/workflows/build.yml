name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key from secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "Add the SIGNING_KEY and SIGNING_PASSWORD secrets"; exit 1; }
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Google Drive sign-in secrets from secrets
        env:
          GOOGLE_TV_SECRET: ${{ secrets.GOOGLE_TV_SECRET }}
          GOOGLE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_SECRET }}
        run: |
          mkdir -p core/src/main/resources
          printf 'tv=%s\ndesktop=%s\n' "$GOOGLE_TV_SECRET" "$GOOGLE_DESKTOP_SECRET" > core/src/main/resources/stremonino-google.properties
          test -n "$GOOGLE_TV_SECRET" || echo "::warning::GOOGLE_TV_SECRET is not set: the Fire Stick can't sign in to Google Drive"
          test -n "$GOOGLE_DESKTOP_SECRET" || echo "::warning::GOOGLE_DESKTOP_SECRET is not set: Linux can't sign in to Google Drive"
      - name: Build release APK
        env:
          SIGNING_KEY_FILE: ${{ runner.temp }}/release.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :core:animalsnifferMain :app:lintDebug assembleRelease :linux:fatJar --no-daemon -PbuildNumber=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: stremio-lite-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish download link
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk stremio-lite.apk
          cp app/build/outputs/apk/release/app-release.apk stremonino.apk
          cp linux/build/dist/stremonino-linux.jar stremonino-linux.jar
          cp linux/build/dist/stremonino-linux.jar stremio-lean-linux.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stremonino build ${{ github.run_number }}
          make_latest: true
          files: |
            stremonino.apk
            stremio-lite.apk
            stremonino-linux.jar
            stremio-lean-linux.jar
